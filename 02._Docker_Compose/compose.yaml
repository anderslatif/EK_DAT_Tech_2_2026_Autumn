services:
  db:
    image: mysql:latest
    container_name: my-mysql
    restart: always
    env_file:
      - .env
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - db_data:/var/lib/mysql
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      
volumes:
  db_data:
