<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 520" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>

  <rect width="1080" height="520" fill="#ffffff"/>

  <!-- Boxes -->
  <g stroke="#222" stroke-width="2">
    <rect x="60" y="200" width="160" height="80" rx="12" fill="#eef4ff"/>
    <rect x="60" y="420" width="160" height="70" rx="12" fill="#ffffff"/>
    <rect x="560" y="45" width="200" height="70" rx="12" fill="#fff4e5"/>
    <rect x="560" y="205" width="200" height="70" rx="12" fill="#fff4e5"/>
    <rect x="560" y="365" width="200" height="70" rx="12" fill="#e6f4ea"/>
  </g>
  <g font-size="18" font-weight="600" text-anchor="middle" fill="#222">
    <text x="140" y="236">DNS resolver</text>
    <text x="140" y="452">Client</text>
    <text x="660" y="85">Root nameserver</text>
    <text x="660" y="236">TLD nameserver</text>
    <text x="660" y="396">ek.dk nameserver</text>
  </g>
  <g font-size="14" text-anchor="middle" fill="#555">
    <text x="140" y="258">(ISP or 1.1.1.1)</text>
    <text x="140" y="474">(your computer)</text>
    <text x="660" y="258">(.dk)</text>
    <text x="660" y="418">(ns.efif.dk)</text>
  </g>

  <!-- Arrows: each question and its answer -->
  <g stroke="#222" stroke-width="2" marker-end="url(#arrow)">
    <line x1="120" y1="418" x2="120" y2="284"/>
    <line x1="160" y1="282" x2="160" y2="416"/>
    <line x1="222" y1="212" x2="555" y2="78"/>
    <line x1="557" y1="97" x2="225" y2="231"/>
    <line x1="222" y1="230" x2="555" y2="230"/>
    <line x1="557" y1="250" x2="225" y2="250"/>
    <line x1="222" y1="248" x2="555" y2="384"/>
    <line x1="557" y1="405" x2="225" y2="269"/>
  </g>

  <!-- Step numbers on the arrows -->
  <g stroke="#f59e0b" stroke-width="2" fill="#ffffff">
    <circle cx="95" cy="350" r="13"/>
    <circle cx="470" cy="88" r="13"/>
    <circle cx="470" cy="160" r="13"/>
    <circle cx="470" cy="210" r="13"/>
    <circle cx="470" cy="272" r="13"/>
    <circle cx="490" cy="330" r="13"/>
    <circle cx="455" cy="395" r="13"/>
    <circle cx="185" cy="350" r="13"/>
  </g>
  <g font-size="15" font-weight="700" text-anchor="middle" fill="#d97706">
    <text x="95" y="355">1</text>
    <text x="470" y="93">2</text>
    <text x="470" y="165">3</text>
    <text x="470" y="215">4</text>
    <text x="470" y="277">5</text>
    <text x="490" y="335">6</text>
    <text x="455" y="400">7</text>
    <text x="185" y="355">8</text>
  </g>

  <!-- Legend -->
  <g stroke="#f59e0b" stroke-width="2" fill="#ffffff">
    <circle cx="815" cy="70" r="13"/>
    <circle cx="815" cy="122" r="13"/>
    <circle cx="815" cy="174" r="13"/>
    <circle cx="815" cy="226" r="13"/>
    <circle cx="815" cy="278" r="13"/>
    <circle cx="815" cy="330" r="13"/>
    <circle cx="815" cy="382" r="13"/>
    <circle cx="815" cy="434" r="13"/>
  </g>
  <g font-size="15" font-weight="700" text-anchor="middle" fill="#d97706">
    <text x="815" y="75">1</text>
    <text x="815" y="127">2</text>
    <text x="815" y="179">3</text>
    <text x="815" y="231">4</text>
    <text x="815" y="283">5</text>
    <text x="815" y="335">6</text>
    <text x="815" y="387">7</text>
    <text x="815" y="439">8</text>
  </g>
  <g font-size="16" fill="#222">
    <text x="840" y="75">What is the IP of ek.dk?</text>
    <text x="840" y="127">Where is .dk?</text>
    <text x="840" y="179">Ask the .dk servers</text>
    <text x="840" y="231">Where is ek.dk?</text>
    <text x="840" y="283">Ask ns.efif.dk</text>
    <text x="840" y="335">What is the IP of ek.dk?</text>
    <text x="840" y="387" font-family="Menlo, Consolas, monospace">195.254.168.52</text>
    <text x="840" y="439" font-family="Menlo, Consolas, monospace">195.254.168.52</text>
