<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 555" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="555" fill="#ffffff"/>

  <!-- Application -->
  <rect x="20" y="20" width="960" height="170" rx="14" fill="#e7f0ff"/>
  <rect x="20" y="20" width="300" height="170" rx="14" fill="#2f6fdb"/>
  <text x="170" y="113" font-size="30" font-weight="bold" text-anchor="middle" fill="#ffffff">Application</text>
  <g font-size="26" text-anchor="middle" fill="#1f2430">
    <rect x="350" y="45" width="94" height="52" rx="10" fill="#ffffff" stroke="#2f6fdb" stroke-width="2.5"/><text x="397" y="80">HTTP</text>
    <rect x="460" y="45" width="110" height="52" rx="10" fill="#ffffff" stroke="#2f6fdb" stroke-width="2.5"/><text x="515" y="80">HTTPS</text>
    <rect x="586" y="45" width="174" height="52" rx="10" fill="#ffffff" stroke="#2f6fdb" stroke-width="2.5"/><text x="673" y="80">WebSocket</text>
    <rect x="776" y="45" width="78" height="52" rx="10" fill="#ffffff" stroke="#2f6fdb" stroke-width="2.5"/><text x="815" y="80">TLS</text>
    <rect x="870" y="45" width="78" height="52" rx="10" fill="#ffffff" stroke="#2f6fdb" stroke-width="2.5"/><text x="909" y="80">SSH</text>
    <rect x="350" y="113" width="78" height="52" rx="10" fill="#ffffff" stroke="#2f6fdb" stroke-width="2.5"/><text x="389" y="148">DNS</text>
    <rect x="444" y="113" width="94" height="52" rx="10" fill="#ffffff" stroke="#2f6fdb" stroke-width="2.5"/><text x="491" y="148">DHCP</text>
    <rect x="554" y="113" width="78" height="52" rx="10" fill="#ffffff" stroke="#2f6fdb" stroke-width="2.5"/><text x="593" y="148">FTP</text>
    <rect x="648" y="113" width="318" height="52" rx="10" fill="#ffffff" stroke="#2f6fdb" stroke-width="2.5"/><text x="807" y="148">SMTP / POP3 / IMAP</text>
  </g>

  <!-- Transport -->
  <rect x="20" y="205" width="960" height="100" rx="14" fill="#e6f7ef"/>
  <rect x="20" y="205" width="300" height="100" rx="14" fill="#1f9d63"/>
  <text x="170" y="265" font-size="30" font-weight="bold" text-anchor="middle" fill="#ffffff">Transport</text>
  <g font-size="26" text-anchor="middle" fill="#1f2430">
    <rect x="350" y="229" width="78" height="52" rx="10" fill="#ffffff" stroke="#1f9d63" stroke-width="2.5"/><text x="389" y="264">TCP</text>
    <rect x="444" y="229" width="78" height="52" rx="10" fill="#ffffff" stroke="#1f9d63" stroke-width="2.5"/><text x="483" y="264">UDP</text>
    <rect x="538" y="229" width="94" height="52" rx="10" fill="#ffffff" stroke="#1f9d63" stroke-width="2.5"/><text x="585" y="264">QUIC</text>
  </g>

  <!-- Network -->
  <rect x="20" y="320" width="960" height="100" rx="14" fill="#fff1e0"/>
  <rect x="20" y="320" width="300" height="100" rx="14" fill="#e07b00"/>
  <text x="170" y="365" font-size="30" font-weight="bold" text-anchor="middle" fill="#ffffff">Network</text>
  <text x="170" y="397" font-size="21" text-anchor="middle" fill="#ffffff">(Internet)</text>
  <g font-size="26" text-anchor="middle" fill="#1f2430">
    <rect x="350" y="344" width="270" height="52" rx="10" fill="#ffffff" stroke="#e07b00" stroke-width="2.5"/><text x="485" y="379">IP (IPv4, IPv6)</text>
    <rect x="636" y="344" width="94" height="52" rx="10" fill="#ffffff" stroke="#e07b00" stroke-width="2.5"/><text x="683" y="379">ICMP</text>
  </g>

  <!-- Network Access -->
  <rect x="20" y="435" width="960" height="100" rx="14" fill="#f3e9ff"/>
  <rect x="20" y="435" width="300" height="100" rx="14" fill="#7c4dcc"/>
  <text x="170" y="480" font-size="30" font-weight="bold" text-anchor="middle" fill="#ffffff">Network Access</text>
  <text x="170" y="512" font-size="21" text-anchor="middle" fill="#ffffff">(Physical + Link)</text>
  <g font-size="26" text-anchor="middle" fill="#1f2430">
    <rect x="350" y="459" width="158" height="52" rx="10" fill="#ffffff" stroke="#7c4dcc" stroke-width="2.5"/><text x="429" y="494">Ethernet</text>
    <rect x="524" y="459" width="110" height="52" rx="10" fill="#ffffff" stroke="#7c4dcc" stroke-width="2.5"/><text x="579" y="494">Wi-Fi</text>
    <rect x="650" y="459" width="78" height="52" rx="10" fill="#ffffff" stroke="#7c4dcc" stroke-width="2.5"/><text x="689" y="494">ARP</text>
  </g>
</svg>
